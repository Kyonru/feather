name: VS Code extension release

# `ext-v*` only. The extension is a satellite: it vendors its own platform
# snapshot into bundled-bin/, so it never needs to ship alongside a platform tag.
on:
  push:
    tags:
      - "ext-v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      vsixFile: ${{ steps.package.outputs.vsixFile }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      - name: Install icon rasterizer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Resolve version from tag
        id: get_version
        run: |
          VERSION="$(bash scripts/release-tag-version.sh "$GITHUB_REF_NAME" --version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify extension package version
        run: |
          EXT_VERSION="$(node -p "require('./apps/vscode-extension/package.json').version")"
          if [ "$EXT_VERSION" != "${{ steps.get_version.outputs.version }}" ]; then
            echo "Tag version ${{ steps.get_version.outputs.version }} does not match vscode-extension/package.json version $EXT_VERSION."
            echo "Fix with: bash scripts/set-version.sh ext ${{ steps.get_version.outputs.version }}"
            exit 1
          fi

      - name: Test extension
        run: pnpm run extension:test

      - name: Package extension
        id: package
        run: |
          pnpm run extension:package
          VERSION="${{ steps.get_version.outputs.version }}"
          VSIX_PATH="$(ls apps/vscode-extension/*.vsix | head -n 1)"
          VSIX_FILE="feather-cli-vscode-${VERSION}.vsix"
          mkdir -p release-assets
          cp "$VSIX_PATH" "release-assets/$VSIX_FILE"
          # The four Bun-compiled CLI binaries (342 MB) are NOT uploaded here.
          # prepare.mjs already places them inside the VSIX under bundled-bin/,
          # so attaching them to every extension release stored them twice.
          # Standalone binaries are published once, on the platform release.
          echo "vsixPath=release-assets/$VSIX_FILE" >> "$GITHUB_OUTPUT"
          echo "vsixFile=$VSIX_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: feather-cli-vscode
          path: ${{ steps.package.outputs.vsixPath }}

      - name: Attach VSIX and CLI binaries to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: release-assets/*
          allowUpdates: true

  publish-vs-marketplace:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: feather-cli-vscode
          path: .

      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ needs.build.outputs.vsixFile }}

  publish-open-vsx:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: feather-cli-vscode
          path: .

      - name: Publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          extensionFile: ${{ needs.build.outputs.vsixFile }}
