name: App E2E

on:
  push:
    branches: [ main, next ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  app-e2e:
    name: React app end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: "pnpm"
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          # Keyed on the job and the lockfile, not the SHA: a per-commit key
          # mints a new entry every push and churns the 10 GB Actions cache
          # quota. The job is in the key because jobs run different turbo tasks;
          # sharing one key let whichever job saved first own it for everyone.
          # Turbo's own input hashing decides what is stale inside the cache.
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Serial: the browser suites start their own servers and time each other
      # out when run at once, which is also why `pnpm run test` is serial.
      - name: Inspector, Studio and Showcase end-to-end
        run: pnpm turbo run //#test:inspector:e2e //#test:studio:e2e //#test:showcase:e2e --concurrency=1

      # The lint guards catch source imports; this catches what actually lands
      # in a bundle, which a transitive or dynamic import can change without any
      # single file importing across the boundary.
      - name: Packaged artifact boundary
        run: |
          pnpm run build
          pnpm --filter @feather/studio run build
          pnpm run check:artifact-boundary
