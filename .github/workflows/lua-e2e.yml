name: Lua E2E

on:
  push:
    branches: [ main, next ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lua-e2e:
    name: Lua runtime end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: "pnpm"

      - name: Install LÖVE
        run: |
          sudo apt-get update
          sudo apt-get install -y love xvfb
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          # Keyed on the job and the lockfile, not the SHA: a per-commit key
          # mints a new entry every push and churns the 10 GB Actions cache
          # quota. The job is in the key because jobs run different turbo tasks;
          # sharing one key let whichever job saved first own it for everyone.
          # Turbo's own input hashing decides what is stale inside the cache.
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lua E2E
        run: pnpm turbo run //#test:lua:e2e
