name: Lua E2E

on:
  pull_request:
  push:
    branches: [ main, next ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lua-e2e:
    name: Lua runtime end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: "pnpm"

      - name: Install LÖVE
        run: |
          sudo apt-get update
          sudo apt-get install -y love xvfb
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lua E2E
        run: pnpm run test:lua:e2e
