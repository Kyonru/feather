name: Release CLI

# `cli-v*`  -> CLI alone (this is the decoupled path)
# `v*`      -> CLI as part of a full platform release
on:
  push:
    tags:
      - "cli-v*"
      - "v*"
  workflow_dispatch:

jobs:
  cli:
    name: CLI
    permissions:
      # The reusable workflow creates or updates the tag's GitHub release after
      # publishing npm and therefore cannot be called with read-only contents.
      contents: write
      id-token: write
    uses: ./.github/workflows/_release-cli.yml
    secrets: inherit
