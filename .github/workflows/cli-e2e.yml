name: CLI E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  cli-e2e:
    name: CLI end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: "pnpm"

      - name: Install LÖVE (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y love squashfs-tools

      - name: Install LÖVE and squashfs-tools (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -L https://github.com/love2d/love/releases/download/11.5/love-11.5-macos.zip -o love-macos.zip
          ditto -x -k love-macos.zip love-macos
          sudo cp -R love-macos/love.app /Applications/love.app
          sudo ln -sf /Applications/love.app/Contents/MacOS/love /usr/local/bin/love
          love --version
          brew install squashfs
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          # Keyed on the lockfile, not the SHA: a per-commit key mints a new
          # entry every push and churns the 10 GB Actions cache quota. Turbo's
          # own input hashing decides what is stale inside the restored cache.
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CLI E2E
        run: pnpm run test:cli:e2e
