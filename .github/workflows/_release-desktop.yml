name: "[reusable] Desktop release"

# Builds and publishes the signed Tauri desktop app for macOS (arm64 + x64),
# Linux, and Windows. Called by release-desktop.yml, which fires on both
# `desktop-v*` (desktop alone) and `v*` (full platform release).

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify desktop version
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: get_version
        run: |
          VERSION="$(bash scripts/release-tag-version.sh "$GITHUB_REF_NAME" --version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify the desktop trio agrees with the tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PKG="$(node -p "require('./package.json').version")"
          TAURI="$(node -p "require('./apps/inspector/src-tauri/tauri.conf.json').version")"
          CARGO="$(sed -n '1,/^version = /s/^version = "\(.*\)"/\1/p' apps/inspector/src-tauri/Cargo.toml | head -n 1)"
          FAIL=0
          for pair in "package.json:$PKG" "apps/inspector/src-tauri/tauri.conf.json:$TAURI" "apps/inspector/src-tauri/Cargo.toml:$CARGO"; do
            FILE="${pair%%:*}"
            FOUND="${pair#*:}"
            if [ "$FOUND" != "$VERSION" ]; then
              echo "$FILE is $FOUND, expected $VERSION"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "Fix with: bash scripts/set-version.sh desktop $VERSION"
            exit 1
          fi

  tauri-release:
    name: Build desktop
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun for the CLI sidecar
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' &&
            'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies Ubuntu only
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple Developer Certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1)
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')

          if [ -z "$CERT_ID" ]; then
            echo "No Developer ID Application certificate found."
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi

          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV

      - name: Write Apple API key
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8" >> $GITHUB_ENV

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}

          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: apps/inspector
          tagName: ${{ github.ref_name }}
          releaseName: "Feather Inspector v${{ needs.verify.outputs.version }}"
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          args: ${{ matrix.args }}
