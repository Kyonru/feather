name: Lint

on:
  push:
    branches: [ main, next ]

permissions:
  contents: read

jobs:
  lint:
    name: Run TypeScript Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: "pnpm"
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          # Keyed on the lockfile, not the SHA: a per-commit key mints a new
          # entry every push and churns the 10 GB Actions cache quota. Turbo's
          # own input hashing decides what is stale inside the restored cache.
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check protocol version sync
        run: pnpm run check:protocol

      - name: Bridge contract tests
        run: pnpm run test:bridge

      - name: Unit tests
        run: pnpm run test:unit

      - name: Run TypeScript checks
        run: pnpm run typecheck:web

      - name: Run linting
        run: pnpm run lint

      - name: Build and test VS Code extension
        run: pnpm run extension:test

  lint-lua:
    name: Run Lua (Love2D) Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      contains(github.event_name, 'pull_request') ||
      contains(github.event.head_commit.message, 'packages/runtime-lua/') ||
      github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua & luarocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks

      - name: Install luacheck
        run: luarocks install luacheck --local

      - name: Add local LuaRocks bin to PATH
        run: echo "$HOME/.luarocks/bin" >> $GITHUB_PATH

      - name: Run luacheck with Love2D globals
        run: luacheck packages/runtime-lua --globals love
