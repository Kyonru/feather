name: Lint

on:
  push:
    branches: [ main, next ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Verify, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: "pnpm"
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          # Keyed on the job and the lockfile, not the SHA: a per-commit key
          # mints a new entry every push and churns the 10 GB Actions cache
          # quota. The job is in the key because jobs run different turbo tasks;
          # sharing one key let whichever job saved first own it for everyone.
          # Turbo's own input hashing decides what is stale inside the cache.
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Install Lua and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          luarocks install luacheck --local
          echo "$HOME/.luarocks/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same gate as `pnpm run verify` locally: every typecheck (web,
      # protocol, host, session-bridge, ui, studio, Lua), lint, and the protocol,
      # registry, plugin-catalog and obsolete-path drift checks.
      - name: Verify
        run: pnpm run verify

      - name: Unit and bridge tests
        run: pnpm turbo run //#test:unit //#test:bridge

      - name: Build and test VS Code extension
        run: pnpm run extension:test
