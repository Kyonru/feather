name: Release Feather Studio

# `studio-v*` only.
#
# Feather Studio is a separately installed application on its own cadence. This
# workflow publishes Studio artifacts and nothing else — no CLI, no Lua runtime,
# no Inspector, no extension. Those trains do not trigger on this tag, which is
# what makes a Studio release genuinely independent.
#
# Releases land on the `studio-v*` tag, a distinct feed from the platform's `v*`
# releases, so a Studio update never appears as an Inspector update.

on:
  push:
    tags:
      - "studio-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Studio version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: get_version
        run: |
          VERSION="$(bash scripts/release-tag-version.sh "$GITHUB_REF_NAME" --version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Studio's version trio agrees with the tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PKG="$(node -p "require('./apps/studio/package.json').version")"
          TAURI="$(node -p "require('./apps/studio/src-tauri/tauri.conf.json').version")"
          CARGO="$(sed -n '1,/^version = /s/^version = "\(.*\)"/\1/p' apps/studio/src-tauri/Cargo.toml | head -n 1)"
          FAIL=0
          for pair in "apps/studio/package.json:$PKG" "tauri.conf.json:$TAURI" "Cargo.toml:$CARGO"; do
            if [ "${pair#*:}" != "$VERSION" ]; then
              echo "${pair%%:*} is ${pair#*:}, expected $VERSION"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "Fix with: bash scripts/set-version.sh studio $VERSION"
            exit 1
          fi

      - name: Assert this tag publishes nothing but Studio
        run: |
          # A Studio release must not be able to ship Inspector, the CLI, the
          # runtime or the extension. Those workflows filter on other tag
          # prefixes; this fails loudly if one ever starts matching studio-v*.
          for wf in release release-desktop release-runtime release-platform vscode-extension; do
            if grep -qE '^\s+- "studio-v\*"' ".github/workflows/${wf}.yml"; then
              echo "${wf}.yml triggers on studio-v* — a Studio release would ship other products."
              exit 1
            fi
          done
          echo "Only Studio publishes on this tag."

  build:
    name: Build Studio
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            prereleaseArgs: "--no-sign"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            prereleaseArgs: "--no-sign"
          - platform: ubuntu-22.04
            args: ""
            # RPM rejects SemVer prerelease hyphens. Keep prerelease coverage
            # on the portable AppImage and Debian package instead.
            prereleaseArgs: "--bundles deb,appimage"
          - platform: windows-latest
            args: ""
            prereleaseArgs: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' &&
            'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies Ubuntu only
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple Developer Certificate
        # Proof prereleases stay unsigned. Stable releases retain the signed,
        # notarized path below and therefore still fail closed on Apple issues.
        if: matrix.platform == 'macos-latest' && !contains(needs.verify.outputs.version, '-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1)
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')

          if [ -z "$CERT_ID" ]; then
            echo "No Developer ID Application certificate found."
            exit 1
          fi

          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV

      - name: Write Apple API key
        if: matrix.platform == 'macos-latest' && !contains(needs.verify.outputs.version, '-')
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8" >> $GITHUB_ENV

      - name: Build and release Feather Studio
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: apps/studio
          tagName: ${{ github.ref_name }}
          releaseName: "Feather Studio v${{ needs.verify.outputs.version }}"
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          args: ${{ matrix.args }} ${{ contains(needs.verify.outputs.version, '-') && matrix.prereleaseArgs || '' }}
